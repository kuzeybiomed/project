<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KuzeyBioMed — Ürünler</title>
  <link rel="icon" href="logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="products.title">Ürünler</h1>
        <p class="crumb" data-i18n="products.crumb">Ana Sayfa / Ürünler</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head"><p data-i18n="products.intro">Kategorilere göz atın.</p></div>
        <div class="grid grid--3">
          <article class="card"><div class="card-icon">🫁</div><h3 data-i18n="home.cat1_t"></h3><p data-i18n="home.cat1_d"></p></article>
          <article class="card"><div class="card-icon">🔬</div><h3 data-i18n="home.cat2_t"></h3><p data-i18n="home.cat2_d"></p></article>
          <article class="card"><div class="card-icon">📈</div><h3 data-i18n="home.cat3_t"></h3><p data-i18n="home.cat3_d"></p></article>
          <article class="card"><div class="card-icon">❤️</div><h3 data-i18n="home.cat4_t"></h3><p data-i18n="home.cat4_d"></p></article>
          <article class="card"><div class="card-icon">🩻</div><h3 data-i18n="home.cat5_t"></h3><p data-i18n="home.cat5_d"></p></article>
          <article class="card"><div class="card-icon">⚙️</div><h3 data-i18n="home.cat6_t"></h3><p data-i18n="home.cat6_d"></p></article>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
